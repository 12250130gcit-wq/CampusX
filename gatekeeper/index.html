<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusX · Gatekeeper Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="../assets/auth.js"></script>
  <script src="../assets/store.js"></script>
  <script src="css/js/data.js"></script>
  <script src="css/js/main.js"></script>
  <script src="css/js/dashboard.js"></script>
  <script>
    var cxSession = CXAuth.requireRole('gatekeeper');
    window.CX_PAGE = 'dashboard';
    window.CX_TITLE = 'Good morning, ' + ((cxSession && cxSession.name) ? cxSession.name.split(' ')[0] : 'Gatekeeper');
    window.CX_BREADCRUMB = 'Overview · Gate operations';
  </script>
</head>
<body data-depth="2">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar-root"></aside>
    <div class="main-col">
      <header class="topbar" id="topbar-root"></header>
      <main class="page" style="padding:24px; background:#FAF8F4;">
        <section class="page-panel" style="max-width:1200px; margin:0 auto;">
          <div class="metrics-grid" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:18px; margin-bottom:18px;">
            <div class="stat-card" style="background:#fff; border:1px solid #E7E2D8; border-radius:14px; padding:18px; box-shadow:0 12px 32px -14px rgba(49,76,28,.28);">
              <div class="label" style="color:#6E7A73; font-size:12px; text-transform:uppercase; letter-spacing:.08em;">Outside</div>
              <div id="stat-outside" class="value" style="font-size:32px; font-weight:800; margin-top:8px; color:#182821;">0</div>
            </div>
            <div class="stat-card" style="background:#fff; border:1px solid #E7E2D8; border-radius:14px; padding:18px; box-shadow:0 12px 32px -14px rgba(49,76,28,.28);">
              <div class="label" style="color:#6E7A73; font-size:12px; text-transform:uppercase; letter-spacing:.08em;">Expected return</div>
              <div id="stat-expected" class="value" style="font-size:32px; font-weight:800; margin-top:8px; color:#182821;">0</div>
            </div>
            <div class="stat-card" style="background:#fff; border:1px solid #E7E2D8; border-radius:14px; padding:18px; box-shadow:0 12px 32px -14px rgba(49,76,28,.28);">
              <div class="label" style="color:#6E7A73; font-size:12px; text-transform:uppercase; letter-spacing:.08em;">Overdue</div>
              <div id="stat-overdue" class="value" style="font-size:32px; font-weight:800; margin-top:8px; color:#182821;">0</div>
            </div>
            <div class="stat-card" style="background:#fff; border:1px solid #E7E2D8; border-radius:14px; padding:18px; box-shadow:0 12px 32px -14px rgba(49,76,28,.28);">
              <div class="label" style="color:#6E7A73; font-size:12px; text-transform:uppercase; letter-spacing:.08em;">Visitors inside</div>
              <div id="stat-visitors" class="value" style="font-size:32px; font-weight:800; margin-top:8px; color:#182821;">0</div>
            </div>
          </div>

          <div id="attention-section" style="margin-bottom:18px;"></div>

          <div style="display:grid; grid-template-columns:1.2fr 0.8fr; gap:18px;">
            <div class="panel-card" style="background:#fff; border:1px solid #E7E2D8; border-radius:14px; padding:18px; box-shadow:0 12px 32px -14px rgba(49,76,28,.28);">
              <h2 style="margin:0 0 12px; font-size:18px;">Live movement</h2>
              <div id="movement-list"></div>
            </div>
            <div class="panel-card" style="background:#fff; border:1px solid #E7E2D8; border-radius:14px; padding:18px; box-shadow:0 12px 32px -14px rgba(49,76,28,.28);">
              <h2 style="margin:0 0 12px; font-size:18px;">Recent activity</h2>
              <div id="activity-list"></div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <div id="backdrop-root"></div>
  </div>
</body>
</html>
